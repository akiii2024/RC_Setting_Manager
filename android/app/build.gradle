plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "0.0.1"
}

def googleServicesFiles = [
    "google-services.json",
    "src/debug/google-services.json",
    "src/profile/google-services.json",
    "src/release/google-services.json",
].collect { file(it) }

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

def requiredSigningProperties = [
    "keyAlias",
    "keyPassword",
    "storeFile",
    "storePassword",
]
def missingSigningProperties = hasReleaseSigning
    ? requiredSigningProperties.findAll {
        !keystoreProperties[it]?.toString()?.trim()
    }
    : []
if (!missingSigningProperties.isEmpty()) {
    throw new GradleException(
        "android/key.properties is missing: ${missingSigningProperties.join(', ')}",
    )
}

def releaseStoreFile = hasReleaseSigning
    ? file(keystoreProperties["storeFile"])
    : null
if (releaseStoreFile != null && !releaseStoreFile.exists()) {
    throw new GradleException(
        "Release keystore not found: ${releaseStoreFile}",
    )
}

def isReleaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (isReleaseBuildRequested && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is required. Create android/key.properties from " +
        "android/key.properties.example before building a release artifact.",
    )
}

if (googleServicesFiles.any { it.exists() }) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.lifecycle(
        "google-services.json not found. Building without the Google Services plugin.",
    )
}

android {
    namespace "com.aki.rcsettings"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.aki.rcsettings"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile releaseStoreFile
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source "../.."
}
