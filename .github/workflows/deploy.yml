name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.35.3'
        channel: 'stable'

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions dependencies
      working-directory: functions
      run: npm ci --ignore-scripts

    - name: Lint Functions
      working-directory: functions
      run: npm run lint

    - name: Test Functions
      working-directory: functions
      run: npm test
        
    - name: Install dependencies
      run: flutter pub get

    - name: Run tests
      run: flutter test

    - name: Validate deployment configuration
      if: github.event_name == 'push'
      env:
        FIREBASE_APP_CHECK_WEB_KEY: ${{ vars.FIREBASE_APP_CHECK_WEB_KEY }}
      run: test -n "$FIREBASE_APP_CHECK_WEB_KEY"
      
    - name: Build web
      env:
        FIREBASE_APP_CHECK_WEB_KEY: ${{ github.event_name == 'pull_request' && 'pull-request-build-only' || vars.FIREBASE_APP_CHECK_WEB_KEY }}
      run: >-
        flutter build web
        --base-href "/RC_Setting_Manager/"
        --dart-define=FIREBASE_APP_CHECK_WEB_KEY="$FIREBASE_APP_CHECK_WEB_KEY"
        --release
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        path: './build/web'

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
