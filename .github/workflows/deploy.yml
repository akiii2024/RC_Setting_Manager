name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.6'
        channel: 'stable'

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions dependencies
      working-directory: functions
      run: npm ci --ignore-scripts

    - name: Lint Functions
      working-directory: functions
      run: npm run lint

    - name: Test Functions
      working-directory: functions
      run: npm test
        
    - name: Install dependencies
      run: flutter pub get

    - name: Check supplemental license notices
      run: node tool/sync_third_party_licenses.mjs --check

    - name: Test license collection helpers
      run: node --test tool/native_licenses_ios_test.mjs tool/sync_third_party_licenses_test.mjs

    - name: Run tests
      run: flutter test

    - name: Check Firebase SDK CSP hashes
      run: node tool/firebase_csp.mjs --check

    - name: Validate deployment configuration
      if: github.event_name == 'push'
      env:
        FIREBASE_APP_CHECK_WEB_KEY: ${{ vars.FIREBASE_APP_CHECK_WEB_KEY }}
      run: test -n "$FIREBASE_APP_CHECK_WEB_KEY"
      
    - name: Build web
      env:
        FIREBASE_APP_CHECK_WEB_KEY: ${{ github.event_name == 'pull_request' && 'pull-request-build-only' || vars.FIREBASE_APP_CHECK_WEB_KEY }}
      run: >-
        flutter build web
        --base-href "/RC_Setting_Manager/"
        --dart-define=FIREBASE_APP_CHECK_WEB_KEY="$FIREBASE_APP_CHECK_WEB_KEY"
        --release
      
    - name: Check public Web artifact
      run: node tool/check_public_web.mjs build/web

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: './build/web'

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
