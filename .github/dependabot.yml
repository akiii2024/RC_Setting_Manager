# 依存更新はPRとして作成し、CIとレビュー後に手動でマージする。
# minor/patchのみをグループ化し、major更新は個別PRにする。
version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      flutterfire-minor-patch:
        applies-to: version-updates
        patterns:
          - "firebase_*"
          - "cloud_firestore"
          - "cloud_functions"
        update-types: [minor, patch]
      flutter-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns:
          - "firebase_*"
          - "cloud_firestore"
          - "cloud_functions"
        update-types: [minor, patch]
    ignore:
      # 基準ツールチェーン: Flutter 3.47.6 / Dart 3.13.5(CI の deploy.yml / release.yml と同一)
      # 2026-10-19 に Flutter 3.35.3 -> 3.47.6 へ揃えたため、旧ツールチェーン由来の
      # ignore(image_picker / path_provider / google_fonts / xml)は削除した。
      # permission_handler 13 requires Android compileSdk 37; Flutter 3.47.6 の既定は 36。
      - dependency-name: permission_handler
        versions: [">=13.0.0 <14.0.0"]
      # flutter_secure_storage 11 は非推奨 API の削除により、既存の保存データ(APIキー等)が
      # 読めなくなる破壊的変更。移行処理を実装するまで 11 系は取り込まない。
      - dependency-name: flutter_secure_storage
        versions: [">=11.0.0 <12.0.0"]

  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      functions-runtime-minor-patch:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      functions-dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # firebase-admin 14 requires Node.js 22+, while Functions runs on Node.js 20.
      - dependency-name: firebase-admin
        versions: [">=14.0.0 <15.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
