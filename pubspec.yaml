name: rc_setting_manager
description: "RC Setting Manager"
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  flutter_launcher_icons: ^0.14.3
  share_plus: ^12.0.2
  google_fonts: ^8.2.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  xml: ^6.4.2
  path_provider: ^2.1.2
  geolocator: 14.0.2
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  image: ^4.5.3
  cloud_functions: ^6.3.5
  firebase_app_check: ^0.4.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/launcher_icon/ios_icon.png
    - lib/data/track_locations.json
