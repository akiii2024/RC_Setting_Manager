import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact
import java.util.zip.ZipFile

// Dependency inspection only. No release build/signing task is requested.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('collectNativeLicenses') {
        doLast {
            def configuration = app.configurations.getByName('releaseRuntimeClasspath')
            def artifacts = configuration.incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts
            def ids = configuration.incoming.resolutionResult.allComponents
                .collect { it.id }.findAll { it instanceof ModuleComponentIdentifier }
            def result = app.dependencies.createArtifactResolutionQuery()
                .forComponents(ids).withArtifacts(MavenModule, MavenPomArtifact).execute()
            def poms = [:]
            result.resolvedComponents.each { component ->
                component.getArtifacts(MavenPomArtifact).each { artifact ->
                    if (artifact.hasProperty('file')) poms[component.id.toString()] = artifact.file.getText('UTF-8')
                }
            }
            def records = []
            artifacts.sort { it.id.componentIdentifier.toString() }.each { artifact ->
                def notices = []
                if (artifact.file.name.endsWith('.jar') || artifact.file.name.endsWith('.aar')) {
                    new ZipFile(artifact.file).withCloseable { zip ->
                        zip.entries().each { entry ->
                            if (!entry.directory && entry.name.tokenize('/').last() ==~ /(?i)(LICENSE|NOTICE|COPYING)([._-].*)?/) {
                                notices << [path: entry.name, text: zip.getInputStream(entry).getText('UTF-8')]
                            }
                        }
                    }
                }
                def coordinate = artifact.id.componentIdentifier.toString()
                records << [coordinate: coordinate, artifact: artifact.file.name,
                    pom: poms[coordinate], notices: notices]
            }
            def output = new File(gradle.rootProject.projectDir, '../build/native-licenses/artifacts.json')
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(records)), 'UTF-8')
            println "Native release license inputs: ${records.size()} artifacts -> ${output}"
        }
    }
}
